<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Served at /__screens by a dev-only Vite middleware (see vite.config.ts).

      `no-store` because every scenario is a deep link into this same document and
      a cached index would serve stale scenario tags after a change.
    -->
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>ComfyPanel Studio &mdash; Screen gallery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/main.tsx"></script>
  </body>
</html>
